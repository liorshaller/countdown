<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>ספירה לאחור</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      padding-top: 100px;
    }
    h1 {
      font-size: 40px;
    }
    #countdown {
      font-size: 30px;
      color: #333;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>ספירה לאחור עד ה-02.07.2025</h1>
  <div id="countdown"></div>

  <script>
    const targetDate = new Date("2025-07-02T00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.getElementById("countdown").innerHTML = "הגענו לתאריך!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML =
        days + " ימים, " + hours + " שעות, " + minutes + " דקות, " + seconds + " שניות";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
